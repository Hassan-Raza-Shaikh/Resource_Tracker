# Xcode project definition (generated into ResourceTracker.xcodeproj with `xcodegen`).
# The .xcodeproj is committed, so you don't need xcodegen just to open it in Xcode —
# re-run `xcodegen generate` only if you edit this file.
name: ResourceTracker

options:
  bundleIdPrefix: com.hassan
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:
  ResourceTracker:
    type: application
    platform: macOS
    sources:
      - path: src
        excludes:
          - "mask_icon.py"
      - path: ResourceTracker/Assets.xcassets
      - path: ResourceTracker/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ResourceTracker/ResourceTracker.entitlements
        buildPhase: none
      - path: Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: Resource Tracker
        PRODUCT_MODULE_NAME: ResourceTracker
        PRODUCT_BUNDLE_IDENTIFIER: com.hassan.ResourceTracker
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

        # Use our hand-maintained Info.plist (shared with build.sh) instead of a generated one.
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Info.plist

        # App Store requirements: sandboxed, hardened, signed.
        CODE_SIGN_ENTITLEMENTS: ResourceTracker/ResourceTracker.entitlements
        ENABLE_APP_SANDBOX: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        CODE_SIGN_STYLE: Automatic
        # Set your Team ID here (or pick it in Xcode > Signing & Capabilities) once
        # you've joined the Apple Developer Program.
        DEVELOPMENT_TEAM: ""

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        COMBINE_HIDPI_IMAGES: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  ResourceTrackerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: ResourceTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.hassan.ResourceTrackerTests
        # The product name has a space, which xcodegen's derived TEST_HOST doesn't account for.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Resource Tracker.app/Contents/MacOS/Resource Tracker"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"

schemes:
  ResourceTracker:
    build:
      targets:
        ResourceTracker: all
    test:
      config: Debug
      targets:
        - ResourceTrackerTests
    run:
      config: Debug
    archive:
      config: Release
